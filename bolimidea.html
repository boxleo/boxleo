<script setup>
import { ref, computed, watch } from 'vue';
import { use } from 'echarts/core';
import VChart from 'vue-echarts';
import { CanvasRenderer } from 'echarts/renderers';
import { LineChart, BarChart } from 'echarts/charts';
import {
  TitleComponent,
  TooltipComponent,
  LegendComponent,
  GridComponent,
  ToolboxComponent
} from 'echarts/components';

use([
  CanvasRenderer,
  LineChart,
  BarChart,
  TitleComponent,
  TooltipComponent,
  LegendComponent,
  GridComponent,
  ToolboxComponent
]);

// UI state
const compact = ref(false);
const search = ref('');
const timeRange = ref('quarter');
const filters = ref({ department: null, status: null });

const departments = ['All', 'Engineering', 'Marketing', 'Sales', 'HR'];
const statuses = ['All', 'Review', 'Interview', 'Shortlisted', 'Hired', 'Rejected'];

// Sample data (can be replaced with API calls)
const metrics = ref([
  { key: 'tech_time', title: 'Avg Days to Hire (Tech)', value: 18, subtitle: 'Days', trend: 'down' },
  { key: 'nontech_time', title: 'Avg Days to Hire (Non-Tech)', value: 23, subtitle: 'Days', trend: 'up' },
  { key: 'offer_accept', title: 'Offer Acceptance', value: '98%', subtitle: '', trend: 'up' },
  { key: 'candidate_ret', title: 'Candidate Retention', value: '92%', subtitle: '', trend: 'down' }
]);

const applications = ref([
  { id: 1, name: 'Alice Chen', position: 'UI/UX Designer', status: 'Interview', date: '2025-04-10', avatar: '/api/placeholder/36/36' },
  { id: 2, name: 'Michael Brown', position: 'Software Engineer', status: 'Review', date: '2025-04-12', avatar: '/api/placeholder/36/36' },
  { id: 3, name: 'Sarah Johnson', position: 'Product Manager', status: 'Shortlisted', date: '2025-04-12', avatar: '/api/placeholder/36/36' },
  { id: 4, name: 'James Wilson', position: 'Data Analyst', status: 'Rejected', date: '2025-04-11', avatar: '/api/placeholder/36/36' },
  { id: 5, name: 'Emma Davis', position: 'Marketing Specialist', status: 'Hired', date: '2025-04-09', avatar: '/api/placeholder/36/36' }
]);

const recommendedJobs = ref([
  { id: 1, title: 'UX Designer', company: 'Maximax Team', icon: 'mdi-palette-outline', type: 'Full-Time' },
  { id: 2, title: 'Senior UX Designer', company: 'Insyte Studios', icon: 'mdi-monitor-dashboard', type: 'Full-Time' },
  { id: 3, title: 'Freelance UI Designer', company: 'Nazmata Team', icon: 'mdi-palette-swatch', type: 'Freelance' }
]);

const topCountries = ref([
  { name: 'Kenya', flag: '/api/placeholder/40/24', cost: 17965, trend: 'up' },
  { name: 'Tanzania', flag: '/api/placeholder/40/24', cost: 15844, trend: 'down' },
  { name: 'Uganda', flag: '/api/placeholder/40/24', cost: 19584, trend: 'up' }
]);

// Charts
const chartOption = computed(() => {
  const categories = timeRange.value === 'month' ? ['W1', 'W2', 'W3', 'W4'] : timeRange.value === 'quarter' ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'] : ['Q1','Q2','Q3','Q4'];
  return {
    tooltip: { trigger: 'axis' },
    legend: { data: ['Applications','Interviews','Hires'] },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: { type: 'category', boundaryGap: false, data: categories },
    yAxis: { type: 'value' },
    series: [
      { name: 'Applications', type: 'line', smooth: true, data: categories.map((_,i)=> 30 + i*5 + Math.round(Math.random()*10)) },
      { name: 'Interviews', type: 'line', smooth: true, data: categories.map((_,i)=> 10 + i*3 + Math.round(Math.random()*6)) },
      { name: 'Hires', type: 'line', smooth: true, data: categories.map((_,i)=> 2 + Math.round(Math.random()*6)) }
    ]
  };
});

const costChartOption = computed(() => ({
  tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
  legend: { data: ['External','Internal'] },
  grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
  xAxis: { type: 'category', data: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'] },
  yAxis: { type: 'value', name: 'Cost ($)', axisLabel: { formatter: '${value}k' } },
  series: [
    { name: 'External', type: 'bar', stack: 'total', data: [10,12,21,18,16,12,15,11] },
    { name: 'Internal', type: 'bar', stack: 'total', data: [2,3,4,3,5,4,2,1] }
  ]
}));

const sourcesChartOption = computed(() => ({
  tooltip: { trigger: 'axis' },
  xAxis: { type: 'category', data: ['Direct','WeWork','LinkedIn','Hired','WorkIn','Instagram','Referral'] },
  yAxis: { type: 'value' },
  series: [{ type: 'bar', data: [60,70,42,78,65,40,50], barMaxWidth: 18 }]
}));

const totalSpend = computed(() => {
  return topCountries.value.reduce((s, c) => s + c.cost, 0);
});

// Filtered applications
const appHeaders = [
  { title: 'Candidate', key: 'name' },
  { title: 'Status', key: 'status' },
  { title: 'Date', key: 'date' },
  { title: 'Actions', key: 'actions' }
];

const filteredApplications = computed(() => {
  const q = search.value.toLowerCase().trim();
  return applications.value.filter(a => {
    if (filters.value.status && filters.value.status !== 'All' && a.status !== filters.value.status) return false;
    if (q === '') return true;
    return [a.name, a.position, a.status].some(v => String(v).toLowerCase().includes(q));
  });
});

// Helpers
function getStatusColor(status){
  const map = { 'Interview':'primary','Review':'info','Shortlisted':'success','Rejected':'error','Hired':'success' };
  return map[status] || 'grey';
}

function toggleCompact(){ compact.value = !compact.value; }

// Export local components
const MetricCard = {
  props: ['title','value','subtitle','trend'],
  template: `
    <v-card elevation="1" rounded class="pa-3" style="height:100%">
      <div class="d-flex justify-space-between align-center mb-2">
        <div>
          <div class="text-caption text--secondary">{{ title }}</div>
          <div class="text-h6 font-weight-bold">{{ value }}</div>
        </div>
        <div>
          <v-icon :color="trend==='up'? 'success':'error'">{{ trend==='up' ? 'mdi-trending-up' : 'mdi-trending-down' }}</v-icon>
        </div>
      </div>
      <div class="text-caption text--secondary">{{ subtitle }}</div>
    </v-card>
  `
};

// Register components globally for this file
// (In a full project you'd import/register properly)
</script>

<script>

  name: 'RecruitmentDashboardModern',

</script>
